   j:{de:"In einer Mail steht „Zur Sendungsverfolgung“. Fährst du mit der Maus darüber, zeigt der Browser unten links die echte Adresse an.",
      fr:"Un e-mail affiche «Suivre mon colis». Si vous survolez le lien avec la souris, le navigateur affiche la vraie adresse en bas à gauche."},
   p:{de:"Entscheidend sind die letzten zwei Teile vor dem ersten einzelnen Schrägstrich, etwa „post.ch“. Der Spickzettel weiter unten zeigt Beispiele.",
      fr:"Ce qui compte, ce sont les deux derniers éléments avant la première barre oblique simple, par exemple «post.ch». L'aide-mémoire plus bas montre des exemples."}},
  {cat:"adressen", ja:1, st:1, en:"Domain",
   t:{de:"Domain", fr:"Nom de domaine"},
   e:{de:"Der Name einer Website, zum Beispiel <strong>sbb.ch</strong>. Wie ein Firmenschild an der Hauswand: leichter zu merken als die IP-Adresse dahinter.",
      fr:"Le nom d'un site, par exemple <strong>sbb.ch</strong>. Comme l'enseigne d'une entreprise : plus facile à retenir que l'adresse IP qui se cache derrière."},
   j:{de:"Alle Adressen mit der Endung .ch verwaltet derzeit die Stiftung Switch im Auftrag des Bundes. Wer eine Domain will, mietet sie bei einem Anbieter, meist für ein Jahr.",
      fr:"La fondation Switch gère actuellement toutes les adresses en .ch sur mandat de la Confédération. Pour obtenir un nom de domaine, on le loue auprès d'un prestataire, généralement pour un an."},
   p:{de:"Betrüger kaufen Namen, die fast gleich aussehen, etwa mit einer Null statt einem O. Lies Domains bei Zahlungen und Logins Buchstabe für Buchstabe.",
      fr:"Les escrocs achètent des noms presque identiques, par exemple avec un zéro à la place d'un O. Lors d'un paiement ou d'une connexion, lisez le nom de domaine lettre par lettre."}},
  {cat:"adressen", ja:1, en:"DNS",
   t:{de:"Adressbuch des Internets (DNS)", fr:"Annuaire d'Internet (DNS)"},
   e:{de:"Wie die <strong>Kontakte</strong> in deinem Handy: Du tippst auf einen Namen, das Handy wählt die Nummer. Du tippst „sbb.ch“, das DNS sucht die passende IP-Adresse heraus.",
      fr:"Comme les <strong>contacts</strong> de votre téléphone : vous touchez un nom, le téléphone compose le numéro. Vous tapez «sbb.ch», le DNS trouve l'adresse IP correspondante."},
   j:{de:"Funktioniert das WLAN, aber keine Seite lädt, liegt es manchmal am DNS. Dann hilft oft ein Neustart des Routers.",
      fr:"Si le Wi-Fi fonctionne mais qu'aucune page ne se charge, le DNS est parfois en cause. Redémarrer le routeur aide souvent."},
   p:{de:"Für den Alltag musst du am DNS nichts einstellen. Ändere es nur, wenn deine IT oder dein Anbieter es empfiehlt.",
      fr:"Au quotidien, vous n'avez rien à régler dans le DNS. Ne le modifiez que sur recommandation de votre service informatique ou de votre fournisseur."}},
  {cat:"adressen", ja:1, top:1, en:"HTTPS",
   t:{de:"HTTPS und Schloss-Symbol", fr:"HTTPS et cadenas"},
   e:{de:"Das <strong>Schloss</strong> neben der Adresse heisst: Die Verbindung ist verschlüsselt. Unterwegs kann niemand mitlesen, was du eingibst. Wie ein verschlossener Umschlag statt einer Postkarte.",
      fr:"Le <strong>cadenas</strong> à côté de l'adresse signifie que la connexion est chiffrée. Personne ne peut lire en route ce que vous saisissez. Comme une enveloppe fermée plutôt qu'une carte postale."},
   j:{de:"Auch Betrüger bekommen das Schloss, oft sogar gratis. Eine Login-Seite kann also verschlüsselt und trotzdem gefälscht sein.",
      fr:"Les escrocs obtiennent eux aussi le cadenas, souvent gratuitement. Une fausse page de connexion peut donc être chiffrée et pourtant frauduleuse."},
   p:{de:"Das Schloss sagt, wie du verbunden bist, nicht mit wem. Prüf zusätzlich immer die Domain.",
      fr:"Le cadenas indique comment vous êtes connecté, pas avec qui. Vérifiez toujours aussi le nom de domaine."}},
  {cat:"adressen", ja:1, en:"Redirect",
   t:{de:"Weiterleitung", fr:"Redirection"},
   e:{de:"Du klickst auf eine Adresse und landest auf einer anderen. Wie ein <strong>Nachsendeauftrag</strong> bei der Post.",
      fr:"Vous cliquez sur une adresse et arrivez sur une autre. Comme un <strong>ordre de réexpédition</strong> à la poste."},
   j:{de:"Kurzlinks wie „bit.ly/…“ leiten weiter. Wohin sie führen, siehst du erst nach dem Klick.",
      fr:"Les liens raccourcis comme «bit.ly/…» redirigent. Vous ne voyez leur destination qu'après le clic."},
   p:{de:"Schau nach einer Weiterleitung kurz in die Adresszeile, bevor du etwas eingibst.",
      fr:"Après une redirection, jetez un œil à la barre d'adresse avant de saisir quoi que ce soit."}},
  {cat:"adressen", ja:1, en:"QR Code",
   t:{de:"QR-Code", fr:"Code QR"},
   e:{de:"Ein <strong>Link zum Scannen</strong>. Die Kamera liest das Muster und öffnet die gespeicherte Adresse.",
      fr:"Un <strong>lien à scanner</strong>. L'appareil photo lit le motif et ouvre l'adresse enregistrée."},
   j:{de:"QR-Codes stehen auf Speisekarten, Plakaten und Parkuhren. Betrüger kleben manchmal eigene Codes über die echten.",
      fr:"On trouve des codes QR sur les cartes de restaurant, les affiches et les parcomètres. Des escrocs collent parfois leurs propres codes par-dessus les vrais."},
   p:{de:"Zeigt dein Handy vor dem Öffnen die Adresse an, lies sie. Bei Zahlungen tippst du die Adresse besser selbst ein.",
      fr:"Si votre téléphone affiche l'adresse avant de l'ouvrir, lisez-la. Pour un paiement, mieux vaut taper l'adresse vous-même."}},

  /* ---------- VERBINDUNG ---------- */
  {cat:"verbindung", ja:1, top:1, en:"Wi-Fi",
   t:{de:"WLAN", fr:"Wi-Fi"},
   e:{de:"Die Funkverbindung zwischen deinem Gerät und dem Router. Das <strong>WLAN</strong> ist die Einfahrt, das Internet die Autobahn dahinter.",
      fr:"La liaison radio entre votre appareil et le routeur. Le <strong>Wi-Fi</strong> est la bretelle d'accès, Internet l'autoroute derrière."},
   j:{de:"„WLAN verbunden, aber kein Internet“ heisst: Die Einfahrt ist offen, die Autobahn dahinter gesperrt. Das Problem liegt dann meist beim Router oder beim Anbieter.",
      fr:"«Connecté au Wi-Fi, mais pas d'Internet» signifie que la bretelle est ouverte, mais l'autoroute fermée. Le problème vient alors généralement du routeur ou du fournisseur."},
   p:{de:"Ein langes WLAN-Passwort schützt vor ungebetenen Mitnutzern. Für Gäste eignet sich ein eigenes Gäste-WLAN.",
      fr:"Un long mot de passe Wi-Fi protège contre les utilisateurs indésirables. Pour vos invités, un réseau Wi-Fi invité séparé est idéal."}},
  {cat:"verbindung", ja:1, en:"Router",
   t:{de:"Router", fr:"Routeur"},
   e:{de:"Das Kästchen mit den Lämpchen, meist im Flur oder unter dem Pult. Es verbindet dein Zuhause mit dem Internet und verteilt die Daten an alle Geräte.",
      fr:"Le petit boîtier aux voyants lumineux, souvent dans l'entrée ou sous le bureau. Il relie votre logement à Internet et répartit les données entre tous les appareils."},
   j:{de:"Der bekannteste IT-Tipp stimmt oft: Router aus, 30 Sekunden warten, wieder ein. Danach sind viele Störungen behoben.",
      fr:"Le conseil informatique le plus connu fonctionne souvent : éteindre le routeur, attendre 30 secondes, le rallumer. Beaucoup de pannes disparaissent ensuite."},
   p:{de:"Stell den Router frei und erhöht auf, nicht in einen Schrank. Wände und Metall schwächen das WLAN.",
      fr:"Placez le routeur en hauteur et à découvert, pas dans une armoire. Les murs et le métal affaiblissent le Wi-Fi."}},
  {cat:"verbindung", ja:1, en:"Internet Service Provider",
   t:{de:"Internetanbieter", fr:"Fournisseur d'accès"},
   e:{de:"Die Firma, die dir den Zugang zum Internet verkauft, etwa Swisscom, Sunrise oder Salt. Sie betreibt die Strassen bis zu deiner Haustür.",
      fr:"L'entreprise qui vous vend l'accès à Internet, par exemple Swisscom, Sunrise ou Salt. Elle exploite les routes jusqu'à votre porte."},
   j:{de:"Bei einer Störung zeigt die Website deines Anbieters oft eine Störungskarte. So weisst du, ob es an dir liegt oder an der ganzen Region.",
      fr:"En cas de panne, le site de votre fournisseur affiche souvent une carte des dérangements. Vous savez ainsi si le problème vient de chez vous ou de toute la région."},
   p:{de:"Vergleiche bei einem neuen Abo auch die Upload-Geschwindigkeit. Sie zählt bei Videoanrufen und beim Hochladen in die Cloud.",
      fr:"Pour un nouvel abonnement, comparez aussi le débit montant. Il compte pour les appels vidéo et l'envoi de fichiers dans le cloud."}},
  {cat:"verbindung", ja:1, en:"Mobile Network",
   t:{de:"Mobilfunk (4G, 5G)", fr:"Réseau mobile (4G, 5G)"},
   e:{de:"Internet über Funkantennen statt über Kabel. Die Zahl steht für die Generation: <strong>5G</strong> ist neuer und schneller als <strong>4G</strong>.",
      fr:"Internet par antennes radio plutôt que par câble. Le chiffre désigne la génération : la <strong>5G</strong> est plus récente et plus rapide que la <strong>4G</strong>."},
   j:{de:"Im Zug wechselt dein Handy ständig von Antenne zu Antenne. In Tunnels und engen Tälern bricht die Verbindung deshalb kurz ab.",
      fr:"Dans le train, votre téléphone passe sans cesse d'une antenne à l'autre. C'est pourquoi la connexion coupe brièvement dans les tunnels et les vallées étroites."},
   p:{de:"Im Ausland kann mobiles Surfen teuer werden. Prüf vor der Reise dein Roaming-Paket oder kauf eine eSIM für das Reiseland.",
      fr:"À l'étranger, l'Internet mobile peut coûter cher. Avant le voyage, vérifiez votre forfait d'itinérance ou achetez une eSIM pour le pays de destination."}},
  {cat:"verbindung", ja:1, en:"Fibre Optics",
   t:{de:"Glasfaser", fr:"Fibre optique"},
   e:{de:"Dünne Fäden aus Glas, durch die Daten als <strong>Lichtblitze</strong> reisen. Schneller und stabiler als die alte Kupferleitung des Telefons.",
      fr:"De fins fils de verre dans lesquels les données voyagent sous forme d'<strong>impulsions lumineuses</strong>. Plus rapide et plus stable que l'ancienne ligne téléphonique en cuivre."},
   j:{de:"Steht im Wohnungsinserat „Glasfaser vorhanden“, ist das ein Plus für Homeoffice und Videoanrufe.",
      fr:"Si l'annonce d'un appartement indique «fibre optique disponible», c'est un atout pour le télétravail et les appels vidéo."},
   p:{de:"Ob deine Adresse Glasfaser hat, zeigt die Verfügbarkeitsprüfung auf den Websites der Anbieter.",
      fr:"Le test d'éligibilité sur les sites des fournisseurs indique si votre adresse est raccordée à la fibre."}},
  {cat:"verbindung", ja:1, en:"Bandwidth",
   t:{de:"Bandbreite (Mbit/s)", fr:"Débit (Mbit/s)"},
   e:{de:"Wie breit die Leitung ist, also wie viele Daten pro Sekunde durchpassen. Mehr <strong>Spuren auf der Autobahn</strong> bedeuten weniger Stau.",
      fr:"La largeur du tuyau, c'est-à-dire la quantité de données qui passe par seconde. Plus l'autoroute a de <strong>voies</strong>, moins il y a de bouchons."},
   j:{de:"Streamen zwei Personen Filme und eine dritte führt einen Videoanruf, teilen sich alle dieselbe Leitung. Dann ruckelt es.",
      fr:"Si deux personnes regardent un film en streaming pendant qu'une troisième passe un appel vidéo, toutes se partagent la même ligne. Et ça saccade."},
   p:{de:"Miss deine Geschwindigkeit mit einem Speedtest, am besten per Kabel. So siehst du, ob du bekommst, was du bezahlst.",
      fr:"Mesurez votre débit avec un test de vitesse, idéalement par câble. Vous verrez si vous obtenez ce que vous payez."}},

  /* ---------- BROWSER UND SUCHE ---------- */
  {cat:"browser", top:1, en:"Browser",
   t:{de:"Browser", fr:"Navigateur"},
   e:{de:"Das Programm, mit dem du Webseiten anschaust, etwa Chrome, Safari, Edge oder Firefox. Es übersetzt den Code einer Seite in das, was du siehst.",
      fr:"Le programme qui affiche les pages web, par exemple Chrome, Safari, Edge ou Firefox. Il traduit le code d'une page en ce que vous voyez."},
   j:{de:"Lädt eine Firmenanwendung nicht richtig, hilft oft ein anderer Browser. Manche Anwendungen sind nur für einen Browser gebaut.",
      fr:"Si une application d'entreprise ne s'affiche pas correctement, essayer un autre navigateur aide souvent. Certaines applications ne sont conçues que pour un seul navigateur."},
   p:{de:"Halte den Browser aktuell. Updates schliessen Sicherheitslücken, oft ohne dass du es merkst.",
      fr:"Gardez votre navigateur à jour. Les mises à jour comblent des failles de sécurité, souvent sans que vous le remarquiez."}},
  {cat:"browser", ja:1, top:1, en:"Search Engine",
   t:{de:"Suchmaschine", fr:"Moteur de recherche"},
   e:{de:"Ein riesiges <strong>Verzeichnis des Webs</strong>. Programme durchsuchen laufend Milliarden Seiten und ordnen sie. Du bekommst eine Liste, sortiert nach dem, was am besten passen soll.",
      fr:"Un immense <strong>répertoire du Web</strong>. Des programmes parcourent en continu des milliards de pages et les classent. Vous obtenez une liste triée selon ce qui devrait correspondre le mieux."},
   j:{de:"Google, Bing oder DuckDuckGo liefern für dieselbe Frage unterschiedliche Listen. Jede gewichtet anders.",
      fr:"Google, Bing ou DuckDuckGo fournissent des listes différentes pour la même question. Chacun pondère autrement."},
   p:{de:"Setz Wörter in Anführungszeichen, um genau diese Wortfolge zu finden, etwa „Säule 3a Höchstbetrag“.",
      fr:"Mettez des mots entre guillemets pour trouver exactement cette expression, par exemple «plafond pilier 3a»."}},
  {cat:"browser", ja:1, en:"Sponsored Results",
   t:{de:"Gesponserte Ergebnisse", fr:"Résultats sponsorisés"},
   e:{de:"<strong>Werbung</strong>, die wie ein normales Suchergebnis aussieht. Sie steht oft ganz oben und trägt nur einen kleinen Hinweis wie „Gesponsert“.",
      fr:"De la <strong>publicité</strong> qui ressemble à un résultat de recherche normal. Elle apparaît souvent tout en haut, avec une petite mention comme «Sponsorisé»."},
   j:{de:"Du suchst den Kundendienst deiner Bank. Ganz oben kann eine bezahlte Anzeige stehen, die gar nicht von der Bank stammt.",
      fr:"Vous cherchez le service client de votre banque. Tout en haut peut figurer une annonce payante qui ne vient pas de la banque."},
   p:{de:"Für Logins, Banken und Behörden tippst du die bekannte Adresse selbst ein oder nutzt ein Lesezeichen.",
      fr:"Pour les connexions, les banques et les autorités, tapez vous-même l'adresse connue ou utilisez un favori."}},
  {cat:"browser", ja:1, en:"Incognito Mode",
   t:{de:"Inkognito-Modus", fr:"Navigation privée"},
   e:{de:"Ein Browserfenster <strong>ohne Gedächtnis</strong>. Nach dem Schliessen vergisst es Verlauf, Cookies und Eingaben, aber nur auf deinem Gerät.",
      fr:"Une fenêtre de navigateur <strong>sans mémoire</strong>. Une fois fermée, elle oublie l'historique, les cookies et les saisies, mais seulement sur votre appareil."},
   j:{de:"Websites, dein Internetanbieter und im Firmennetz auch dein Arbeitgeber sehen trotzdem, was du tust. Google verpflichtete sich 2024, Milliarden Datensätze aus privaten Browsersitzungen zu löschen, um eine Klage beizulegen.",
      fr:"Les sites, votre fournisseur d'accès et, sur le réseau de l'entreprise, votre employeur voient malgré tout ce que vous faites. En 2024, Google s'est engagé à supprimer des milliards de données issues de sessions privées pour régler une action en justice."},
   p:{de:"Praktisch auf einem geteilten Computer oder für ein Geschenk, das niemand sehen soll. Anonym macht er dich nicht.",
      fr:"Pratique sur un ordinateur partagé ou pour un cadeau qui doit rester secret. Elle ne vous rend pas anonyme."}},
  {cat:"browser", ja:1, top:1, en:"Cookies",
   t:{de:"Cookies", fr:"Cookies"},
   e:{de:"Kleine <strong>Notizzettel</strong>, die eine Website in deinem Browser ablegt. Damit erkennt sie dich wieder und merkt sich zum Beispiel den Warenkorb oder die Sprache.",
      fr:"De petites <strong>notes</strong> qu'un site dépose dans votre navigateur. Grâce à elles, il vous reconnaît et se souvient par exemple de votre panier ou de votre langue."},
   j:{de:"Nützliche Cookies halten dich eingeloggt. Andere stammen von Werbefirmen und dienen dem Tracking.",
      fr:"Les cookies utiles vous gardent connecté. D'autres viennent d'entreprises publicitaires et servent au pistage."},
   p:{de:"Löschst du alle Cookies, musst du dich überall neu anmelden. Lösch lieber gezielt oder blockiere Cookies von Drittanbietern.",
      fr:"Si vous supprimez tous les cookies, vous devrez vous reconnecter partout. Supprimez plutôt de manière ciblée ou bloquez les cookies tiers."}},
  {cat:"browser", ja:1, st:1, en:"Cookie Banner",
   t:{de:"Cookie-Banner", fr:"Bandeau de cookies"},
   e:{de:"Das Fenster, das beim Öffnen einer Seite fragt, welche Cookies du erlaubst. Oft ist „Alle akzeptieren“ gross und farbig, „Ablehnen“ dagegen klein und versteckt.",
      fr:"La fenêtre qui demande, à l'ouverture d'une page, quels cookies vous acceptez. Souvent, «Tout accepter» est grand et coloré, «Refuser» petit et caché."},
   j:{de:"In der EU brauchen alle nicht notwendigen Cookies vorher deine Zustimmung. In der Schweiz verlangt das Fernmeldegesetz, dass die Seite informiert und dir das Ablehnen ermöglicht.",
      fr:"Dans l'UE, tous les cookies non nécessaires exigent votre accord préalable. En Suisse, la loi sur les télécommunications impose au site d'informer et de vous permettre de refuser."},
   p:{de:"Such nach „Nur notwendige“ oder „Einstellungen“. Das kostet einen Klick mehr, dafür folgt dir weniger Werbung.",
      fr:"Cherchez «Uniquement les nécessaires» ou «Paramètres». Cela coûte un clic de plus, mais moins de publicité vous suit."}},

  /* ---------- DATEN UND CLOUD ---------- */
  {cat:"cloud", ja:1, top:1, en:"Cloud",
   t:{de:"Cloud", fr:"Cloud (nuage)"},
   e:{de:"Speicherplatz und Programme in Rechenzentren statt auf deinem Gerät. Die Cloud ist nicht in der Luft. Sie ist einfach der <strong>Computer von jemand anderem</strong>.",
      fr:"De l'espace de stockage et des programmes situés dans des centres de données plutôt que sur votre appareil. Le cloud n'est pas dans les airs. C'est simplement l'<strong>ordinateur de quelqu'un d'autre</strong>."},
   j:{de:"Deine Handyfotos landen automatisch in iCloud oder Google Fotos. Geht das Handy verloren, sind die Bilder noch da.",
      fr:"Les photos de votre téléphone sont copiées automatiquement dans iCloud ou Google Photos. Si vous perdez le téléphone, les images sont toujours là."},
   p:{de:"Im Job gehören Firmendaten nur in die Cloud, die dein Arbeitgeber freigegeben hat, nicht in dein privates Konto.",
      fr:"Au travail, les données de l'entreprise vont uniquement dans le cloud validé par votre employeur, pas dans votre compte privé."}},
  {cat:"cloud", en:"Data Centre",
   t:{de:"Rechenzentrum", fr:"Centre de données"},
   e:{de:"Eine Halle voller Server, gekühlt, bewacht und mit Notstrom. Hier <strong>wohnt die Cloud</strong>.",
      fr:"Un bâtiment rempli de serveurs, refroidi, surveillé et doté d'une alimentation de secours. C'est là qu'<strong>habite le cloud</strong>."},
   j:{de:"Viele Firmen achten darauf, dass ihre Daten in Rechenzentren in der Schweiz liegen. Das kann für Verträge und Datenschutz wichtig sein.",
      fr:"Beaucoup d'entreprises veillent à ce que leurs données soient stockées dans des centres de données en Suisse. Cela peut compter pour les contrats et la protection des données."},
   p:{de:"Frag bei Cloud-Angeboten im Job nach dem Speicherort. Die Antwort sollte in den Vertragsunterlagen stehen.",
      fr:"Pour une offre cloud professionnelle, demandez où les données sont stockées. La réponse devrait figurer dans les documents contractuels."}},
  {cat:"cloud", ja:1, en:"Sync",
   t:{de:"Synchronisation", fr:"Synchronisation"},
   e:{de:"Deine Geräte <strong>gleichen sich ab</strong>. Was du auf dem Handy änderst, steht kurz darauf auch auf dem Laptop.",
      fr:"Vos appareils <strong>s'alignent</strong> les uns sur les autres. Ce que vous modifiez sur le téléphone apparaît peu après sur l'ordinateur portable."},
   j:{de:"Du hakst auf dem Handy etwas auf der geteilten Einkaufsliste ab. Zu Hause auf dem Tablet ist es ebenfalls erledigt.",
      fr:"Vous cochez un article de la liste de courses partagée sur votre téléphone. Sur la tablette à la maison, il est coché aussi."},
   p:{de:"Synchronisation ist kein Backup. Löschst du eine Datei, verschwindet sie auf allen Geräten.",
      fr:"La synchronisation n'est pas une sauvegarde. Si vous supprimez un fichier, il disparaît sur tous les appareils."}},
  {cat:"cloud", ja:1, en:"Upload and Download",
   t:{de:"Upload und Download", fr:"Téléverser et télécharger"},
   e:{de:"<strong>Download</strong> heisst herunterladen, vom Internet auf dein Gerät. <strong>Upload</strong> heisst hochladen, von deinem Gerät ins Internet.",
      fr:"<strong>Télécharger</strong>, c'est récupérer d'Internet sur votre appareil. <strong>Téléverser</strong>, c'est envoyer de votre appareil vers Internet."},
   j:{de:"Ein Foto in den Klassenchat schicken ist ein Upload. Den Stundenplan als PDF speichern ist ein Download.",
      fr:"Envoyer une photo dans le groupe de classe, c'est téléverser. Enregistrer l'horaire en PDF, c'est télécharger."},
   p:{de:"Bei vielen Abos ist der Upload viel langsamer als der Download. Grosse Videos hochzuladen dauert deshalb länger.",
      fr:"Dans beaucoup d'abonnements, le débit montant est bien plus faible que le débit descendant. C'est pourquoi l'envoi de grandes vidéos prend plus de temps."}},
  {cat:"cloud", ja:1, en:"Streaming",
   t:{de:"Streaming", fr:"Streaming"},
   e:{de:"Musik oder Filme laufen direkt aus dem Internet, ohne dass du sie zuerst ganz herunterlädst. Wie <strong>Wasser aus dem Hahn</strong> statt aus der Flasche.",
      fr:"La musique ou les films sont lus directement depuis Internet, sans téléchargement complet préalable. Comme l'<strong>eau du robinet</strong> plutôt qu'en bouteille."},
   j:{de:"Bei schwacher Verbindung schaltet der Dienst automatisch auf eine tiefere Bildqualität. Das Bild wird unscharf, läuft aber weiter.",
      fr:"Quand la connexion est faible, le service passe automatiquement à une qualité d'image inférieure. L'image devient floue, mais continue."},
   p:{de:"Unterwegs ohne WLAN lädst du Musik oder Filme besser vorher herunter. Das schont dein Datenvolumen.",
      fr:"En déplacement sans Wi-Fi, mieux vaut télécharger musique ou films à l'avance. Cela ménage votre volume de données."}},
  {cat:"cloud", en:"Email",
   t:{de:"E-Mail", fr:"E-mail (courriel)"},
   e:{de:"Elektronische Post, die über mehrere Server reist. Unterwegs ist sie meist geschützt, beim Mailanbieter aber oft lesbar gespeichert. Eher <strong>Postkarte</strong> als versiegelter Brief.",
      fr:"Du courrier électronique qui transite par plusieurs serveurs. En route, il est généralement protégé, mais il est souvent stocké en clair chez le fournisseur. Plutôt une <strong>carte postale</strong> qu'une lettre scellée."},
   j:{de:"Für Lohnausweise oder Arztberichte nutzen viele Firmen eine gesicherte Mail oder ein Portal statt einer normalen Mail.",
      fr:"Pour les certificats de salaire ou les rapports médicaux, beaucoup d'entreprises utilisent un e-mail sécurisé ou un portail plutôt qu'un e-mail normal."},
   p:{de:"Prüf vor dem Senden das Feld „An“. Die automatische Vervollständigung wählt schnell die falsche Person.",
      fr:"Avant d'envoyer, vérifiez le champ «À». La saisie automatique choisit vite la mauvaise personne."}},
  {cat:"cloud", en:"Messenger",
   t:{de:"Messenger", fr:"Messagerie instantanée"},
   e:{de:"Apps für Kurznachrichten wie WhatsApp, Signal oder Threema. Viele verschlüsseln <strong>von Gerät zu Gerät</strong>, sodass nicht einmal der Anbieter mitlesen kann.",
      fr:"Des applications de messages courts comme WhatsApp, Signal ou Threema. Beaucoup chiffrent <strong>d'appareil à appareil</strong>, si bien que même le fournisseur ne peut pas les lire."},

   j:{de:"Du verkaufst ein Velo. Ein Käufer will per Link „die Zahlung freigeben“ und fragt nach deinen Kartendaten. Zum Empfangen von Geld brauchst du aber nie Kartendaten.",
      fr:"Vous vendez un vélo. Un acheteur veut «débloquer le paiement» via un lien et demande vos données de carte. Or, pour recevoir de l'argent, il ne faut jamais de données de carte."},
   p:{de:"Bleib im Chat der Plattform. Bei teuren Dingen ist eine Übergabe vor Ort mit Barzahlung oder Twint am sichersten.",
      fr:"Restez dans la messagerie de la plateforme. Pour les objets chers, une remise en main propre avec paiement sur place, en espèces ou par Twint, est la solution la plus sûre."}},
  {cat:"betrug", ja:1, en:"Investment Fraud",
   t:{de:"Online-Anlagebetrug", fr:"Escroquerie à l'investissement en ligne"},
   e:{de:"Gefälschte Plattformen versprechen <strong>hohe Gewinne</strong> mit Krypto, Aktien oder Gold. Anfangs zeigen sie sogar Gewinne an, damit du mehr einzahlst.",
      fr:"De fausses plateformes promettent des <strong>gains élevés</strong> avec des cryptomonnaies, des actions ou de l'or. Au début, elles affichent même des gains pour que vous versiez davantage."},
   j:{de:"Oft beginnt es mit Werbung, in der Prominente angeblich eine Anlage empfehlen. Im ersten Halbjahr 2025 haben sich die Meldungen dazu beim Bund fast verfünffacht.",
      fr:"Tout commence souvent par une publicité où des célébrités recommanderaient un placement. Au premier semestre 2025, les signalements à ce sujet ont presque quintuplé."},
   p:{de:"Prüf Anbieter in der Warnliste der FINMA. Hohe Gewinne ohne Risiko gibt es nicht.",
      fr:"Vérifiez les prestataires dans la liste d'alerte de la FINMA. Des gains élevés sans risque, cela n'existe pas."}},
  {cat:"betrug", ja:1, en:"Romance Scam",
   t:{de:"Liebesbetrug (Romance Scam)", fr:"Arnaque sentimentale"},
   e:{de:"Betrüger bauen online über Wochen eine <strong>Liebesbeziehung</strong> auf. Dann kommt eine Notlage, und sie bitten um Geld.",
      fr:"Des escrocs construisent en ligne une <strong>relation amoureuse</strong> pendant des semaines. Puis survient une urgence, et ils demandent de l'argent."},
   j:{de:"Die Person kann sich nie per Video zeigen, hat aber plötzlich Arztkosten oder Zollgebühren. Viele Betroffene schämen sich und melden den Betrug spät.",
      fr:"La personne ne peut jamais se montrer en vidéo, mais a soudain des frais médicaux ou de douane. Beaucoup de victimes ont honte et signalent l'arnaque tardivement."},
   p:{de:"Überweise niemandem Geld, den du nie persönlich getroffen hast. Sprich vorher mit einer Vertrauensperson.",
      fr:"Ne versez jamais d'argent à quelqu'un que vous n'avez jamais rencontré en personne. Parlez-en d'abord à une personne de confiance."}},

  /* ---------- KONTEN SCHÜTZEN ---------- */
  {cat:"konten", ja:1, en:"Strong Password",
   t:{de:"Sicheres Passwort", fr:"Mot de passe sûr"},
   e:{de:"<strong>Lang schlägt kompliziert.</strong> Ein Satz aus mehreren Wörtern ist sicherer und leichter zu merken als ein kurzes Zeichengewirr.",
      fr:"<strong>La longueur bat la complexité.</strong> Une phrase de plusieurs mots est plus sûre et plus facile à retenir qu'un court mélange de signes."},
   j:{de:"„Sommer2026!“ ist schnell geknackt. „Velo Kaffee Bergsee Rosengarten“ hält viel länger stand.",
      fr:"«Ete2026!» est vite deviné par un logiciel. «vélo café lac montagne roseraie» résiste bien plus longtemps."},
   p:{de:"Das Wichtigste ist ein eigenes Passwort für jedes Konto. Sonst öffnet ein einziges Datenleck alle Türen.",
      fr:"L'essentiel est un mot de passe différent pour chaque compte. Sinon, une seule fuite de données ouvre toutes les portes."}},
  {cat:"konten", ja:1, top:1, en:"Password Manager",
   t:{de:"Passwort-Manager", fr:"Gestionnaire de mots de passe"},
   e:{de:"Ein digitaler <strong>Tresor</strong> für alle Passwörter. Du merkst dir nur noch ein starkes Hauptpasswort, den Rest erledigt das Programm.",
      fr:"Un <strong>coffre-fort</strong> numérique pour tous vos mots de passe. Vous ne retenez plus qu'un mot de passe principal solide, le programme s'occupe du reste."},
   j:{de:"Der Manager erzeugt für jedes Konto ein langes Zufallspasswort und füllt es nur auf der echten Seite aus. Bleibt das Feld leer, ist das ein nützliches Warnsignal.",
      fr:"Le gestionnaire crée un long mot de passe aléatoire pour chaque compte et ne le remplit que sur le vrai site. Si le champ reste vide, c'est un signal d'alerte utile."},
   p:{de:"In Browsern und Handys ist oft schon einer eingebaut. Schütze das Hauptpasswort zusätzlich mit einem zweiten Faktor.",
      fr:"Les navigateurs et les téléphones en intègrent souvent déjà un. Protégez aussi le mot de passe principal avec un deuxième facteur."}},
  {cat:"konten", ja:1, top:1, en:"Two-Factor Authentication",
   t:{de:"Zwei-Faktor-Authentifizierung (2FA)", fr:"Authentification à deux facteurs (2FA)"},
   e:{de:"Zum Passwort kommt ein <strong>zweiter Beweis</strong>, etwa ein Code aufs Handy oder eine Bestätigung in der App. Wie Schlüssel plus Alarmcode: Ein gestohlenes Passwort allein reicht nicht mehr.",
      fr:"Au mot de passe s'ajoute une <strong>deuxième preuve</strong>, par exemple un code sur le téléphone ou une confirmation dans l'application. Comme une clé plus un code d'alarme : un mot de passe volé ne suffit plus."},
   j:{de:"Raffinierte Phishing-Seiten fangen inzwischen auch den zweiten Code ab, etwa bei gefälschten SharePoint-Mails. 2FA bleibt trotzdem eine der wirksamsten Schutzmassnahmen.",
      fr:"Des pages d'hameçonnage sophistiquées interceptent désormais aussi le deuxième code, par exemple via de faux e-mails SharePoint. La 2FA reste malgré tout l'une des protections les plus efficaces."},
   p:{de:"Schalte 2FA zuerst bei Mail, Bank und Cloud ein. Gib einen Code nie an jemanden weiter, auch nicht an den „Support“.",
      fr:"Activez la 2FA d'abord pour l'e-mail, la banque et le cloud. Ne communiquez jamais un code à qui que ce soit, pas même au «support»."}},
  {cat:"konten", ja:1, en:"Passkey",
   t:{de:"Passkey", fr:"Clé d'accès (passkey)"},
   e:{de:"<strong>Anmelden ohne Passwort</strong>, mit Fingerabdruck, Gesicht oder Geräte-PIN. Der Schlüssel bleibt auf deinem Gerät und funktioniert nur auf der echten Seite.",
      fr:"<strong>Se connecter sans mot de passe</strong>, avec l'empreinte digitale, le visage ou le code de l'appareil. La clé reste sur votre appareil et ne fonctionne que sur le vrai site."},
   j:{de:"Grosse Dienste wie Google, Apple oder Microsoft bieten Passkeys an. Eine Phishing-Seite kann damit nichts anfangen.",
      fr:"De grands services comme Google, Apple ou Microsoft proposent des clés d'accès. Une page d'hameçonnage ne peut rien en faire."},
   p:{de:"Wo ein Dienst Passkeys anbietet, lohnt sich der Wechsel. Richte sie auf zwei Geräten ein, falls eines verloren geht.",
      fr:"Quand un service propose des clés d'accès, le passage en vaut la peine. Configurez-les sur deux appareils, au cas où l'un serait perdu."}},
  {cat:"konten", ja:1, en:"Data Breach",
   t:{de:"Datenleck", fr:"Fuite de données"},
   e:{de:"Kundendaten einer Firma geraten in <strong>falsche Hände</strong>, etwa Mailadressen und Passwörter. Sie landen oft in Listen, die Kriminelle untereinander tauschen.",
      fr:"Les données clients d'une entreprise tombent entre de <strong>mauvaises mains</strong>, par exemple des adresses e-mail et des mots de passe. Elles finissent souvent dans des listes échangées entre criminels."},
   j:{de:"Auf der Website „Have I Been Pwned“ prüfst du, ob deine Mailadresse in bekannten Datenlecks vorkommt.",
      fr:"Sur le site «Have I Been Pwned», vous pouvez vérifier si votre adresse e-mail figure dans des fuites connues."},
   p:{de:"Taucht deine Adresse auf, ändere das betroffene Passwort, auch überall dort, wo du es ebenfalls verwendest.",
      fr:"Si votre adresse apparaît, changez le mot de passe concerné partout où vous l'utilisez."}},
  {cat:"konten", ja:1, en:"Account Takeover",
   t:{de:"Kontoübernahme", fr:"Piratage de compte"},
   e:{de:"Jemand <strong>übernimmt dein Konto</strong>, etwa bei Mail, WhatsApp oder Instagram, und sperrt dich aus. Dann schreibt er in deinem Namen an deine Kontakte.",
      fr:"Quelqu'un <strong>prend le contrôle de votre compte</strong>, par exemple e-mail, WhatsApp ou Instagram, et vous en exclut. Puis il écrit en votre nom à vos contacts."},
   j:{de:"Eine Freundin schreibt per WhatsApp, sie brauche dringend einen sechsstelligen Code, den du gleich per SMS bekommst. Mit diesem Code übernimmt der Betrüger dein Konto.",
      fr:"Une amie vous écrit sur WhatsApp qu'elle a besoin d'urgence d'un code à six chiffres que vous allez recevoir par SMS. Avec ce code, l'escroc prend le contrôle de votre compte."},
   p:{de:"Bestätigungscodes sind nur für dich. Hat jemand dein Konto übernommen, warne deine Kontakte über einen anderen Kanal.",
      fr:"Les codes de confirmation sont pour vous seul. Si quelqu'un a pris votre compte, prévenez vos contacts par un autre canal."}},

  /* ---------- GERÄTE UND NETZWERK ---------- */
  {cat:"geraete", top:1, en:"Ransomware",
   t:{de:"Erpressungstrojaner (Ransomware)", fr:"Rançongiciel (ransomware)"},
   e:{de:"Schadsoftware, die deine Dateien verschlüsselt und <strong>Lösegeld</strong> verlangt. Oft drohen die Täter zusätzlich, gestohlene Daten zu veröffentlichen.",
      fr:"Un logiciel malveillant qui chiffre vos fichiers et exige une <strong>rançon</strong>. Souvent, les auteurs menacent en plus de publier des données volées."},
   j:{de:"Im ersten Halbjahr 2026 registrierte das Bundesamt für Cybersicherheit in der Schweiz 79 Fälle. Die tatsächliche Zahl dürfte höher liegen.",
      fr:"Au premier semestre 2026, l'Office fédéral de la cybersécurité a enregistré 79 cas en Suisse. Le nombre réel est probablement plus élevé."},
   p:{de:"Der beste Schutz ist ein aktuelles Backup, das nicht dauerhaft mit dem Computer verbunden ist. Zahle kein Lösegeld und melde den Fall.",
      fr:"La meilleure protection est une sauvegarde récente qui n'est pas connectée en permanence à l'ordinateur. Ne payez pas de rançon et signalez le cas."}},
  {cat:"geraete", ja:1, top:1, en:"Backup",
   t:{de:"Datensicherung (Backup)", fr:"Sauvegarde (backup)"},
   e:{de:"Eine Kopie deiner Daten an einem zweiten Ort. Wie ein <strong>Ersatzschlüssel bei der Nachbarin</strong>: Du brauchst ihn selten, aber dann dringend.",
      fr:"Une copie de vos données à un deuxième endroit. Comme un <strong>double des clés chez la voisine</strong> : on en a rarement besoin, mais alors de toute urgence."},
   j:{de:"Die Faustregel heisst 3-2-1: drei Kopien auf zwei verschiedenen Speichern, eine davon ausser Haus oder in der Cloud.",
      fr:"La règle d'or s'appelle 3-2-1 : trois copies sur deux supports différents, dont une hors de la maison ou dans le cloud."},
   p:{de:"Teste einmal, ob du eine Datei aus dem Backup wirklich zurückholen kannst. Ein Backup ohne Test ist nur eine Hoffnung.",
      fr:"Testez une fois si vous pouvez vraiment restaurer un fichier depuis la sauvegarde. Une sauvegarde jamais testée n'est qu'un espoir."}},
  {cat:"geraete", ja:1, en:"Antivirus",
   t:{de:"Virenschutz", fr:"Antivirus"},
   e:{de:"Ein Programm, das bekannte Schadsoftware erkennt und blockiert. Wie ein <strong>Türsteher mit einer Liste</strong> bekannter Störenfriede.",
      fr:"Un programme qui détecte et bloque les logiciels malveillants connus. Comme un <strong>portier muni d'une liste</strong> de fauteurs de troubles connus."},
   j:{de:"Windows und macOS bringen bereits einen eingebauten Schutz mit. Für den Alltag reicht er meist, solange er aktuell ist.",
      fr:"Windows et macOS intègrent déjà une protection. Au quotidien, elle suffit généralement, tant qu'elle est à jour."},
   p:{de:"Neue Tricks erkennt kein Virenschutz zuverlässig. Er ersetzt keine Vorsicht bei Anhängen und Links.",
      fr:"Aucun antivirus ne détecte de manière fiable les nouvelles ruses. Il ne remplace pas la prudence face aux pièces jointes et aux liens."}},
  {cat:"geraete", ja:1, en:"Firewall",
   t:{de:"Firewall", fr:"Pare-feu"},
   e:{de:"Ein Filter zwischen deinem Gerät oder Netz und dem Internet. Wie eine <strong>Pförtnerin</strong>, die nur erlaubte Besucher durchlässt.",
      fr:"Un filtre entre votre appareil ou votre réseau et Internet. Comme une <strong>concierge</strong> qui ne laisse passer que les visiteurs autorisés."},
   j:{de:"Router und Betriebssysteme haben eine Firewall eingebaut. In Firmen sorgt die IT für strengere Regeln.",
      fr:"Les routeurs et les systèmes d'exploitation intègrent un pare-feu. En entreprise, le service informatique applique des règles plus strictes."},
   p:{de:"Schalte die eingebaute Firewall nicht aus, auch wenn ein Programm dich dazu auffordert.",
      fr:"Ne désactivez pas le pare-feu intégré, même si un programme vous le demande."}},
  {cat:"geraete", en:"Public Wi-Fi and VPN",
   t:{de:"Öffentliches WLAN und VPN", fr:"Wi-Fi public et VPN"},
   e:{de:"Gratis-WLAN im Café oder Hotel teilst du mit Fremden. Ein <strong>VPN</strong> baut einen verschlüsselten Tunnel durch dieses Netz.",
      fr:"Le Wi-Fi gratuit d'un café ou d'un hôtel est partagé avec des inconnus. Un <strong>VPN</strong> crée un tunnel chiffré à travers ce réseau."},
   j:{de:"Viele Firmen verlangen im Homeoffice oder unterwegs das Firmen-VPN. Erst damit erreichst du interne Systeme.",
      fr:"Beaucoup d'entreprises exigent leur VPN en télétravail ou en déplacement. Lui seul donne accès aux systèmes internes."},
   p:{de:"Dank HTTPS ist öffentliches WLAN heute weniger riskant als früher. Für E-Banking unterwegs ist der Hotspot deines Handys trotzdem die bessere Wahl.",
      fr:"Grâce au HTTPS, le Wi-Fi public est aujourd'hui moins risqué qu'autrefois. Pour l'e-banking en déplacement, le partage de connexion de votre téléphone reste le meilleur choix."}},
  {cat:"geraete", ja:1, en:"Connected Devices",
   t:{de:"Vernetzte Geräte", fr:"Objets connectés"},
   e:{de:"Alles mit Internetanschluss, das kein Computer ist: Smart-TV, Babyphone, Saugroboter, Drucker. Fachleute sagen <strong>Internet der Dinge</strong>.",
      fr:"Tout ce qui est connecté à Internet sans être un ordinateur : téléviseur connecté, babyphone, robot aspirateur, imprimante. Les spécialistes parlent d'<strong>Internet des objets</strong>."},
   j:{de:"Eine Kamera mit dem Standardpasswort „admin“ lässt sich im Internet aufspüren. Fremde können dann mitschauen.",
      fr:"Une caméra avec le mot de passe par défaut «admin» peut être repérée sur Internet. Des inconnus peuvent alors regarder."},
   p:{de:"Ändere beim Einrichten das Standardpasswort und installiere Updates. Geräte ohne Updates gehören nicht ins Netz.",
      fr:"Changez le mot de passe par défaut dès l'installation et faites les mises à jour. Les appareils sans mises à jour n'ont rien à faire sur le réseau."}},
  {cat:"geraete", en:"Unknown USB Stick",
   t:{de:"Fremder USB-Stick", fr:"Clé USB inconnue"},
   e:{de:"Ein gefundener USB-Stick kann Schadsoftware enthalten, die beim Einstecken startet. <strong>Neugier</strong> ist hier der Köder.",
      fr:"Une clé USB trouvée peut contenir un logiciel malveillant qui se lance dès qu'on la branche. Ici, la <strong>curiosité</strong> sert d'appât."},
   j:{de:"Auf dem Firmenparkplatz liegt ein Stick mit der Aufschrift „Löhne 2026“. Genau so testen Angreifer, wer neugierig ist.",
      fr:"Sur le parking de l'entreprise traîne une clé marquée «Salaires 2026». C'est exactement ainsi que les attaquants testent la curiosité."},
   p:{de:"Steck fremde Sticks nie ein, auch nicht „nur kurz“. Gib sie der IT ab.",
      fr:"Ne branchez jamais une clé inconnue, même «juste pour voir». Remettez-la au service informatique."}},

  /* ---------- SICHER IM JOB ---------- */
  {cat:"cjob", top:1, en:"Reporting an Incident",
   t:{de:"Vorfall melden", fr:"Signaler un incident"},
   e:{de:"Sofort Bescheid geben, wenn etwas komisch ist: ein falscher Klick, eine seltsame Mail, ein verlorenes Gerät. <strong>Je früher die IT davon weiss</strong>, desto kleiner der Schaden.",
      fr:"Prévenir immédiatement quand quelque chose cloche : un mauvais clic, un e-mail étrange, un appareil perdu. <strong>Plus tôt le service informatique le sait</strong>, plus le dommage reste limité."},
   j:{de:"Wer aus Scham schweigt, gibt Angreifern Zeit. Gute Firmen danken für jede Meldung, auch für einen Fehlalarm.",
      fr:"Se taire par honte donne du temps aux attaquants. Les bonnes entreprises remercient pour chaque signalement, même pour une fausse alerte."},
   p:{de:"Notier dir die Nummer der IT-Hotline auf Papier. Privat meldest du Vorfälle dem Bundesamt für Cybersicherheit über report.ncsc.admin.ch.",
      fr:"Notez le numéro de la hotline informatique sur papier. À titre privé, vous signalez les incidents à l'Office fédéral de la cybersécurité via report.ncsc.admin.ch."}},
  {cat:"cjob", en:"Four-Eyes Principle",
   t:{de:"Vieraugenprinzip", fr:"Principe des quatre yeux"},
   e:{de:"Wichtige Aktionen brauchen die Zustimmung einer <strong>zweiten Person</strong>. Ein Betrüger muss dann zwei Menschen täuschen statt einen.",
      fr:"Les actions importantes nécessitent l'accord d'une <strong>deuxième personne</strong>. L'escroc doit alors tromper deux personnes au lieu d'une."},
   j:{de:"Die Buchhaltung übernimmt eine neue Bankverbindung eines Lieferanten erst nach einem Rückruf unter der bekannten Nummer und der Freigabe durch eine zweite Person.",
      fr:"La comptabilité n'enregistre les nouvelles coordonnées bancaires d'un fournisseur qu'après un rappel au numéro connu et la validation d'une deuxième personne."},
   p:{de:"Ruf für die Kontrolle die Nummer an, die du schon kennst, nicht die aus der Mail.",
      fr:"Pour vérifier, appelez le numéro que vous connaissez déjà, pas celui de l'e-mail."}},
  {cat:"cjob", en:"Least Privilege",
   t:{de:"Minimale Zugriffsrechte", fr:"Droits d'accès minimaux"},
   e:{de:"Jede Person bekommt nur Zugriff auf das, was sie für ihre Arbeit braucht. Wie <strong>Schlüssel nur für die Räume</strong>, die man betreten muss.",
      fr:"Chaque personne n'accède qu'à ce dont elle a besoin pour son travail. Comme des <strong>clés uniquement pour les pièces</strong> où l'on doit entrer."},
   j:{de:"Übernimmt ein Angreifer das Konto einer Praktikantin, erreicht er damit nicht gleich die Lohndaten der ganzen Firma.",
      fr:"Si un attaquant prend le compte d'une stagiaire, il n'atteint pas pour autant les données salariales de toute l'entreprise."},
   p:{de:"Melde, wenn du nach einem Stellenwechsel noch Zugriff auf alte Ordner hast. Das erhöht das Risiko, falls jemand dein Konto missbraucht.",
      fr:"Signalez si vous avez encore accès à d'anciens dossiers après un changement de poste. Cela augmente le risque si quelqu'un abuse de votre compte."}},
  {cat:"cjob", en:"Screen Lock and Clean Desk",
   t:{de:"Bildschirm sperren und aufgeräumter Arbeitsplatz", fr:"Écran verrouillé et bureau rangé"},
   e:{de:"Wer den Platz verlässt, <strong>sperrt den Bildschirm</strong>. Vertrauliche Papiere liegen nicht offen herum.",
      fr:"Quand on quitte sa place, on <strong>verrouille l'écran</strong>. Les documents confidentiels ne traînent pas."},
   j:{de:"Eine Tastenkombination genügt: Windows-Taste und L, auf dem Mac Ctrl, Cmd und Q.",
      fr:"Un raccourci suffit : touche Windows et L, sur Mac Ctrl, Cmd et Q."},
   p:{de:"Im Zug und im Café helfen ein Sichtschutzfilter und etwas Abstand zu den Nachbarn.",
      fr:"Dans le train et au café, un filtre de confidentialité et un peu de distance avec les voisins aident."}},
  {cat:"cjob", en:"Working from Home Securely",
   t:{de:"Sicher im Homeoffice", fr:"Télétravail sécurisé"},
   e:{de:"Auch zu Hause gelten die Regeln der Firma. Das <strong>Firmengerät</strong> ist für die Arbeit da, nicht für die Familie.",
      fr:"À la maison aussi, les règles de l'entreprise s'appliquent. L'<strong>appareil professionnel</strong> sert au travail, pas à la famille."},
   j:{de:"Die Kinder wollen kurz auf dem Firmenlaptop spielen. Ein heruntergeladenes Spiel kann Schadsoftware ins Firmennetz bringen.",
      fr:"Les enfants veulent jouer un moment sur l'ordinateur professionnel. Un jeu téléchargé peut introduire un logiciel malveillant dans le réseau de l'entreprise."},
   p:{de:"Nutze das Firmen-VPN, sperr den Bildschirm auch zu Hause und führ vertrauliche Telefonate nicht auf dem Balkon.",
      fr:"Utilisez le VPN de l'entreprise, verrouillez l'écran même à la maison et ne passez pas d'appels confidentiels sur le balcon."}},
  {cat:"cjob", en:"Phishing Simulation",
   t:{de:"Phishing-Simulation", fr:"Simulation d'hameçonnage"},
   e:{de:"Die eigene Firma verschickt <strong>harmlose Test-Mails</strong>, die wie Phishing aussehen. So übt das Team, Fälschungen zu erkennen.",
      fr:"L'entreprise envoie elle-même des <strong>e-mails de test inoffensifs</strong> qui ressemblent à de l'hameçonnage. L'équipe s'entraîne ainsi à repérer les faux."},
   j:{de:"Du klickst auf eine Testmail und landest auf einer Lernseite statt bei Betrügern. Das ist peinlich, aber billig gelernt.",
      fr:"Vous cliquez sur un e-mail de test et arrivez sur une page d'apprentissage plutôt que chez des escrocs. C'est gênant, mais la leçon ne coûte pas cher."},
   p:{de:"Melde verdächtige Mails über den Meldeknopf, auch wenn du einen Test vermutest. Genau das soll man üben.",
      fr:"Signalez les e-mails suspects avec le bouton prévu, même si vous soupçonnez un test. C'est exactement ce qu'on veut entraîner."}},
  {cat:"cjob", en:"Shadow IT",
   t:{de:"Schatten-IT", fr:"Informatique fantôme (shadow IT)"},
   e:{de:"Programme, Apps oder Cloud-Dienste, die Mitarbeitende <strong>ohne Wissen der IT</strong> nutzen. Meist gut gemeint, aber ohne Schutz und Kontrolle.",
      fr:"Des logiciels, applications ou services cloud utilisés <strong>à l'insu du service informatique</strong>. C'est généralement bien intentionné, mais sans protection ni contrôle."},
   j:{de:"Das Team teilt Kundendaten über einen privaten Dropbox-Ordner, weil das Firmenlaufwerk umständlich ist. Verlässt jemand die Firma, behält er den Zugriff.",
      fr:"L'équipe partage des données clients dans un dossier Dropbox privé, parce que le lecteur de l'entreprise est peu pratique. Si quelqu'un quitte l'entreprise, il garde l'accès."},
   p:{de:"Fehlt dir ein Werkzeug, frag die IT nach einer erlaubten Lösung. Bei KI-Tools heisst dasselbe Problem Shadow AI.",
      fr:"S'il vous manque un outil, demandez une solution autorisée au service informatique. Pour les outils d'IA, on parle de shadow AI."}},

  /* ---------- RECHT UND BEHÖRDEN ---------- */
  {cat:"crecht", ja:1, st:1, en:"Federal Office for Cyber Security (BACS)",
   t:{de:"Bundesamt für Cybersicherheit (BACS)", fr:"Office fédéral de la cybersécurité (OFCS)"},
   e:{de:"Die <strong>zentrale Anlaufstelle</strong> des Bundes für Cybersicherheit. Hier meldest du Vorfälle, auch als Privatperson, und findest Warnungen zu aktuellen Maschen.",
      fr:"Le <strong>point de contact central</strong> de la Confédération pour la cybersécurité. Vous pouvez y signaler des incidents, même à titre privé, et y trouver des alertes sur les arnaques actuelles."},
   j:{de:"2024 stammten rund 90 % der Meldungen von Privatpersonen. Jede Meldung hilft, andere rechtzeitig zu warnen.",
      fr:"En 2024, environ 90 % des signalements provenaient de particuliers. Chaque signalement aide à avertir les autres à temps."},

const XRULES = {de:[], fr:[]};
ALL.forEach(x=>{ const a = XREF[x.en]; if(!a) return;
  ["de","fr"].forEach(lg=>a[lg].forEach(w=>XRULES[lg].push({id:x.id, re:new RegExp(`(?<![\\p{L}\\d-])(${w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})(?![\\p{L}\\d])`,"u")})));
});
["de","fr"].forEach(lg=>XRULES[lg].sort((a,b)=>b.re.source.length-a.re.source.length));
function linkify(html, lg, selfId, used){
  return html.split(/(<[^>]+>)/).map(part=>{
    if(part.startsWith("<")) return part;
    for(const r of XRULES[lg]){
      if(r.id===selfId || used.has(r.id)) continue;
      if(r.re.test(part)){ used.add(r.id); part = part.replace(r.re, `<a class="xref" href="#t-${r.id}" data-id="${r.id}">$1</a>`); }
    }
    return part;
  }).join("");
}

    <div class="ampel">${AMPEL.map(a=>`<div class="light ${a.cls}"><div class="dot"></div><h3>${L(a.h)}</h3><ul>${a.items.map(i=>`<li>${L(i)}</li>`).join("")}</ul></div>`).join("")}</div>
  </section>`;
  const langs = mode==="both" ? ["de","fr"] : [mode];
  if(TOPICS.length) h += `<section class="cat" id="themen">
    <div class="cat-head"><span class="num">${L(UI.topNum)}</span><h2>${L(UI.topH)}</h2><div class="desc">${L(UI.topP)}</div></div>
    <div class="topics">${TOPICS.map(t=>`<article class="topic">
      <span class="tag">${L(t.tag)}</span><h3>${L(t.t)}</h3><p>${L(t.d)}</p>
      ${langs.map(lg=>`<div class="prompt ${lg}"><b>${one(UI.startP,lg)}${mode==="both"?" · "+lg.toUpperCase():""}</b><span class="ptext">${esc(one(t.p,lg))}</span><button class="copy" type="button" data-lg="${lg}">${one(UI.copy,lg)}</button></div>`).join("")}
    </article>`).join("")}</div>
  </section>`;
  if(URLX){
    const fu = u => mode==="fr" ? u.replace("/de/sendungen","/fr/envois").replace(/\/de$/,"/fr").replace("/konto","/compte") : u;
    const hl = (u,d) => esc(fu(u)).replace(esc(d), `<mark>${esc(d)}</mark>`);
    h += `<section class="cat" id="adresse">
    <div class="cat-head"><span class="num">${L(UI.urlNum)}</span><h2>${L(UI.urlH)}</h2><div class="desc">${L(UI.urlP)}</div></div>
    <div class="urlbox"><div class="anat">${URLX.parts.map(q=>`<div class="seg ${q.c}"><code>${fu(q.p)}</code><span>${L(q.l)}</span></div>`).join("")}</div>
    <ul class="urlex">${URLX.ex.map(e=>`<li class="${e.ok?"ok":"ko"}"><span class="mark" aria-hidden="true">${e.ok?"✓":"✗"}</span><div><code>${hl(e.u,e.dom)}</code><span>${L(e.d)}</span></div></li>`).join("")}</ul></div>
  </section>`;
  }
  if(SOS){
    h += `<section class="cat" id="notfall">
    <div class="cat-head"><span class="num">${L(UI.sosNum)}</span><h2>${L(UI.sosH)}</h2><div class="desc">${L(UI.sosP)}</div></div>
    <div class="sos">${SOS.cards.map(c=>`<article class="soscard"><h3>${L(c.h)}</h3><ol>${c.s.map(x=>`<li>${L(x)}</li>`).join("")}</ol></article>`).join("")}</div>
    <p class="sosfoot">${L(SOS.foot)}</p>
  </section>`;
  }
  h += `<section class="cat" id="quellen">
    <div class="cat-head"><span class="num">${L(UI.srcNum)}</span><h2>${L(UI.srcH)}</h2><div class="desc">${L(UI.srcP)}</div></div>
    <ol class="sources">${SOURCES.map(q=>`<li><a href="${q.u}" target="_blank" rel="noopener">${L(q.t)}</a></li>`).join("")}</ol>
  </section>`;
  document.getElementById("main").innerHTML = h;
  document.getElementById("foot").innerHTML = L(UI.foot);
}

const XNAME = {mythen:"mythChip", quiz:"quizChip", ampel:"ampelChip", themen:"topChip", adresse:"urlChip", notfall:"sosChip", quellen:"srcH"};
const NAV = () => [{id:"all",name:UI.all}, {id:"top",name:UI.topTen}, ...CATS, ...EXTRAS().map(id=>({id, name:UI[XNAME[id]]}))];
const NARROW = matchMedia("(max-width:600px)");
function renderNav(){
  const chipName = p => mode==="both" ? `${p.de} / ${p.fr}` : plain(p);
  document.getElementById("chips").innerHTML = NAV().map(c=>`<button class="chip nav" type="button" data-id="${c.id}" aria-pressed="${c.id===active}">${chipName(c.name)}</button>`).join("");
  const cnt = id => { const n = id==="top" ? TERMS.filter(t=>t.top).length : TERMS.filter(t=>t.cat===id).length; return n ? `<span class="n">${n}</span>` : ""; };
  document.getElementById("toc").innerHTML = `<h2>${mode==="fr" ? UI.toc.fr : mode==="de" ? UI.toc.de : UI.toc.de+" · "+UI.toc.fr}</h2><ul>${NAV().map((c,i)=>
    `${c.id==="mythen"||c.id===CATS[0].id?'<li class="sep"></li>':""}<li><button class="nav" type="button" data-id="${c.id}" aria-pressed="${c.id===active}"><span>${L(c.name)}</span>${cnt(c.id)}</button></li>`).join("")}</ul>`;
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===mode));
  const ph = NARROW.matches ? UI.searchShort : UI.search;
  document.getElementById("q").placeholder = mode==="both" ? ph.both : mode==="fr" ? nb(ph.fr) : ph.de;
  const tb = document.getElementById("theme"); tb.setAttribute("aria-label", mode==="fr" ? UI.theme.fr : UI.theme.de); tb.title = tb.getAttribute("aria-label");
}

function renderAll(){
  document.body.className = mode + (expandAll ? " expand" : "");
  document.documentElement.lang = mode==="fr" ? "fr" : "de";
  document.title = mode==="fr" ? strip(nb(UI.h1.fr))+" · "+UI.docT.fr : strip(UI.h1.de)+" · "+UI.docT.de;
  renderHero(); renderMain(); renderNav(); apply(); spy();
}

function apply(){
  const term = document.getElementById("q").value.trim().toLowerCase();
  document.body.classList.toggle("searching", !!term);
  let total = 0;
  document.querySelectorAll("#glossary section.cat").forEach(sec=>{
    const catOk = active==="all" || active==="top" || active===sec.id;
    let n = 0;
    sec.querySelectorAll(".card").forEach(card=>{
      const ok = catOk && (active!=="top" || card.dataset.top==="1") && (!term || card.dataset.search.includes(term));
      card.style.display = ok ? "" : "none"; if(ok) n++;
    });
    sec.style.display = n ? "" : "none";
    sec.querySelector(".count").textContent = term ? `${n} ${mode==="both" ? "Treffer / résultat(s)" : plain(UI.hits)}` : "";
    total += n;
  });
  let extra = false;
  EXTRAS().forEach(id=>{ const on = !term && (active==="all" || active===id); document.getElementById(id).style.display = on ? "" : "none"; extra = extra || on; });
  document.getElementById("topnext").hidden = !(active==="top" && !term);
  const ew = document.getElementById("elsewhere");
  const other = term ? Object.keys(SETS).filter(k=>k!==topic).map(k=>({k, n:ALL.filter(x=>x.topic===k && x.s.includes(term)).length})).filter(o=>o.n) : [];
  ew.hidden = !other.length;
  ew.innerHTML = other.map(o=>{ const t = lg => one(UI.also,lg).replace("{t}", tlabel(o.k,lg)).replace("{n}", o.n);
    return `<button type="button" class="elsebtn" data-topic="${o.k}">${mode==="both" ? t("de")+" / "+t("fr") : t(mode)} →</button>`; }).join("");
  document.getElementById("empty").style.display = (total===0 && !extra) ? "block" : "none";
}

function select(id, scroll=true){
  active = id;
  document.querySelectorAll(".nav:not(.startbtn)").forEach(x=>x.setAttribute("aria-pressed", x.dataset.id===id));
  apply();
  if(!scroll) return;
  const target = id==="all" ? document.querySelector(".intro") : id==="top" ? document.getElementById("glossary") : document.getElementById(id);
  if(target) window.scrollTo({top: target.getBoundingClientRect().top + window.scrollY - document.querySelector(".toolbar").offsetHeight - 16, behavior:"smooth"});
  spy(); setTimeout(spy, 700);
}

/* Aktiven Abschnitt im Inhaltsverzeichnis markieren */
function spy(){
  const off = document.querySelector(".toolbar").offsetHeight + 40;
  let cur = null;
  document.querySelectorAll("#main section.cat").forEach(s=>{ if(s.style.display!=="none" && s.getBoundingClientRect().top - off <= 0) cur = s.id; });
  document.querySelectorAll(".toc button").forEach(b=>b.classList.toggle("current", b.dataset.id===cur));
}
window.addEventListener("scroll", spy, {passive:true});

/* Querverweis: Vorschau und Sprung */
const tip = document.getElementById("xtip");
function showTip(a){
  const x = ALL.find(t=>t.id===a.dataset.id); if(!x) return;
  const lg = a.closest("[lang]")?.getAttribute("lang")==="fr" ? "fr" : "de";
  let txt = strip(one(x.e,lg)); if(txt.length>170) txt = txt.slice(0,167).replace(/\s\S*$/,"")+" …";
  const where = x.topic!==topic ? `<em>${one(UI.inTopic,lg).replace("{t}", tlabel(x.topic,lg))}</em>` : "";
  tip.innerHTML = `${where}<b>${one(x.t,lg)}</b>${txt}<small>${one(UI.jump,lg)}</small>`;
  const r = a.getBoundingClientRect();
  const tw = Math.min(320, document.documentElement.clientWidth - 24);
  tip.style.left = Math.max(window.scrollX + 12, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - tw - 12)) + "px";
  tip.style.top = (window.scrollY + r.bottom + 8) + "px";
  tip.classList.add("on");
}
const hideTip = () => tip.classList.remove("on");
document.addEventListener("mouseover", e=>{ const a = e.target.closest("a.xref"); if(a) showTip(a); });
document.addEventListener("mouseout", e=>{ if(e.target.closest("a.xref")) hideTip(); });
document.addEventListener("focusin", e=>{ const a = e.target.closest("a.xref"); if(a) showTip(a); else hideTip(); });
function goTo(id){
  hideTip();
  document.getElementById("q").value = "";
  const x = ALL.find(t=>t.id===id); if(!x) return;
  if(x.topic!==topic) setTopic(x.topic, true); else select("all", false);
  const el = document.getElementById("t-"+id); if(!el) return;
  window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - document.querySelector(".toolbar").offsetHeight - 20, behavior:"smooth"});
  el.classList.add("flash","open"); const mb = el.querySelector(".morebtn"); if(mb) mb.setAttribute("aria-expanded","true"); setTimeout(()=>el.classList.remove("flash"), 1600);
}

/* Themenwechsel */
function setTopic(k, keepScroll){
  if(!SETS[k]) return;
  topic = k; useTopic(k); quizScore = 0; active = "all";
  try{ localStorage.setItem("ki-glossar-topic", k); }catch(_){}
  try{ history.replaceState(null, "", "#"+k); }catch(_){}
  renderAll();
  if(!keepScroll) window.scrollTo({top:0});
}

/* Dunkelmodus */
const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function paintThemeBtn(){ document.getElementById("theme").innerHTML = isDark() ? IC.sun : IC.moon; }
document.getElementById("theme").addEventListener("click", ()=>{
  root.dataset.theme = isDark() ? "light" : "dark";
  try{ localStorage.setItem("ki-glossar-theme", root.dataset.theme); }catch(_){}
  paintThemeBtn();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintThemeBtn);

/* Events */
document.querySelector(".langs").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  mode = b.dataset.lang; quizScore = 0;
  try{ localStorage.setItem("ki-glossar-lang", mode); }catch(_){}
  renderAll();
});
document.addEventListener("change", e=>{
  if(e.target.id!=="expandall") return;
  expandAll = e.target.checked;
  try{ localStorage.setItem("ki-glossar-expand", expandAll?"1":"0"); }catch(_){}
  document.body.classList.toggle("expand", expandAll);
});
let quizScore = 0;
document.addEventListener("click", e=>{
  const tb = e.target.closest(".topicbtn");
  if(tb){ if(tb.dataset.topic!==topic) setTopic(tb.dataset.topic); return; }
  const eb = e.target.closest(".elsebtn");
  if(eb){ setTopic(eb.dataset.topic, true); const g = document.getElementById("glossary");
    window.scrollTo({top: g.getBoundingClientRect().top + window.scrollY - document.querySelector(".toolbar").offsetHeight - 16, behavior:"smooth"}); return; }
  const ob = e.target.closest(".ordersw button");
  if(ob){ order = ob.dataset.order; try{ localStorage.setItem("ki-glossar-order", order); }catch(_){}
    const y = window.scrollY; renderMain(); apply(); window.scrollTo(0,y); return; }
  const opt = e.target.closest(".opt");
  if(opt){ const li = opt.closest(".qq"); if(li.classList.contains("done")) return;
    const q = QUIZ[+li.dataset.i], k = +opt.dataset.k, ok = k===q.a;
    li.classList.add("done", ok?"ok":"ko");
    li.querySelectorAll(".opt").forEach(b=>{ const kk=+b.dataset.k; if(kk===q.a) b.classList.add("right"); else if(kk===k) b.classList.add("wrong"); b.disabled = true; });
    const fb = li.querySelector(".qfb"); fb.hidden = false; fb.innerHTML = `<b>${L(ok?UI.right:UI.wrong)}</b> ${L(q.x)}`;
    if(ok) quizScore++;
    document.getElementById("qscore").innerHTML = `${quizScore} / ${QUIZ.length} ${L(UI.score)}`; return; }
  if(e.target.closest(".qreset")){ quizScore = 0; const y = window.scrollY; renderMain(); apply(); window.scrollTo(0,y); return; }
  const mb = e.target.closest(".morebtn");
  if(mb){ const c = mb.closest(".card"); const open = c.classList.toggle("open"); mb.setAttribute("aria-expanded", open);
    const lab = p => mode==="both" ? p.de+" / "+nb(p.fr) : one(p, mode);
    mb.textContent = open ? lab(UI.less) : lab(UI.more); return; }
  const n = e.target.closest(".nav"); if(n){ select(n.dataset.id); return; }
  const a = e.target.closest("a.xref"); if(a){ e.preventDefault(); goTo(a.dataset.id); return; }
  const b = e.target.closest(".copy"); if(!b) return;
  const lg = b.dataset.lg, txt = b.parentElement.querySelector(".ptext").textContent;
  const done = ()=>{ b.textContent = one(UI.copied,lg); setTimeout(()=>b.textContent = one(UI.copy,lg),1500); };
  const fallback = ()=>{ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove(); done(); };
  try{ navigator.clipboard.writeText(txt).then(done, fallback); }catch(_){ fallback(); }
});
document.getElementById("q").addEventListener("input", ()=>{
  if(EXTRAS().includes(active)) select("all", false);
  apply(); spy();
});

NARROW.addEventListener?.("change", renderNav);
window.addEventListener("hashchange", ()=>{ const h = location.hash.slice(1); if(SETS[h] && h!==topic) setTopic(h); });
renderAll(); paintThemeBtn();
</script>
</body>
</html>
